name: Android APKs

on:
  push:
    branches: [miami]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.renderer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        renderer: [GL3, VULKAN]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and platform
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # APKs are signed with the key from the repository secrets so every
      # build can be installed over the previous one. Without the secrets
      # (e.g. pull requests from forks) Gradle's debug key is used instead.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/revc.jks"
            echo "REVC_KEYSTORE=$RUNNER_TEMP/revc.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, signing with the debug key"
          fi

      - name: Build debug and release APKs
        working-directory: android
        env:
          REVC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REVC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REVC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease -PrevcRenderer=${{ matrix.renderer }}

      - name: Verify signatures and collect APKs
        run: |
          mkdir -p out
          for type in debug release; do
            apk=$(ls android/app/build/outputs/apk/$type/*.apk | head -n1)
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk"
            cp "$apk" "out/reVC-${{ matrix.renderer }}-$type.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: reVC-${{ matrix.renderer }}
          path: out/*.apk

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Signed APKs built from ${{ github.sha }}.
            - `reVC-GL3-release.apk` / `reVC-GL3-debug.apk`: OpenGL ES renderer, every graphics option (Neo pipelines, NEW_RENDERER, screen droplets).
            - `reVC-VULKAN-release.apk` / `reVC-VULKAN-debug.apk`: Vulkan renderer.
            Release builds are optimized; debug builds keep symbols for debugging.
          files: apks/*.apk
